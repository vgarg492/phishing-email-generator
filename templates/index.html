  <div id="aggression-level" class="aggression-level">
    <!-- percent of aggression -->
    <h4>Phishing Aggression Level:</h4>
    <input type="range" id="aggressionRange" min="0" max="100" value="50" class="slider">
      <!-- Aggression level will be displayed here -->
  </div>

  <div class="container">
    <h1>Phishing Email Generator</h1>
    <textarea id="prompt" placeholder="Enter your prompt..."></textarea>
    <button onclick="sendPrompt()">Generate Email</button>
    
    <!-- Typology info div - initially hidden -->
    <div id="typology-info" class="typology-info" style="display: none;">
      <h4>Detected Phishing Typologies:</h4>
      <ul id="typologyList" class="typology-list">
        <!-- Typologies will be populated here -->
      </ul>
    </div>
  </div>

  <div class="email-box" id="emailBox">
    <div class="compose-header">
        <span class="compose-title">New Message</span>
        <div class="header-actions">
            <button class="header-btn">−</button>
            <button class="header-btn">□</button>
            <button class="header-btn">×</button>
        </div>
    </div>

    <div class="compose-body">
        <div class="field-row">
            <div class="field-label">To</div>
            <input type="email" class="field-input" placeholder="Recipients">
            <a href="#" class="cc-bcc-toggle" onclick="toggleCcBcc()">Cc Bcc</a>
        </div>

        <div class="cc-bcc-fields" id="ccBccFields">
            <div class="field-row">
                <div class="field-label">Cc</div>
                <input type="email" class="field-input" placeholder="Carbon copy recipients">
            </div>
            <div class="field-row">
                <div class="field-label">Bcc</div>
                <input type="email" class="field-input" placeholder="Blind carbon copy recipients">
            </div>
        </div>

        <div class="field-row subject-row">
            <div class="field-label">Subject</div>
            <input type="text" class="field-input" placeholder="Subject">
        </div>

        <textarea class="compose-editor" placeholder="Compose email"></textarea>            
    </div>

    <div class="compose-footer">
        <button class="send-button">
            Send
        </button>
        <div class="footer-actions">
            <button class="footer-btn attachment-icon" title="Attach files"></button>
            <button class="footer-btn drive-icon" title="Insert files using Drive"></button>
            <button class="footer-btn photo-icon" title="Insert photo"></button>
            <button class="footer-btn link-icon" title="Insert link"></button>
            <button class="footer-btn emoji-icon" title="Insert emoji"></button>
            <button class="footer-btn more-options" title="More options"></button>
            <button class="footer-btn trash-icon" title="Discard draft"></button>
        </div>
    </div>
