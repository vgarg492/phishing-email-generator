<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phising Email - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
    <div class="container">
        <!-- Left Panel - Gradient Background -->
        <div class="left-panel">
            <div class="brand-logo">
                <h2>Phising Email</h2>
            </div>
        </div>

        <!-- Right Panel - Login Form -->
        <div class="right-panel">
            <div class="login-form">
                <h1>Log In</h1>
                <p class="subtitle">Enter your username and password to login </p>

                <form method="POST" action="/login">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="username" id="username" name="username" placeholder="Enter your username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input">
                            <input type="password" id="password" name="password" placeholder="Enter your Password" required>
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                    
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="sign-in-btn">Log In</button>
                </form>

                <div class="form-footer">
                    <p>Don't have an account? <a href="{{ url_for('signup') }}" class="sign-up-link">Sign Up</a></p>
                    
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
